services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ragdiva-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      ragdiva_network:
        ipv4_address: 10.10.24.2

  db:
    image: mysql:9.7.1
    container_name: ragdiva-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: my_secret_password
      MYSQL_DATABASE: my_local_db
      MYSQL_USER: my_db_user
      MYSQL_PASSWORD: user_password
    volumes:
      - ./mysql_stored_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      ragdiva_network:
        ipv4_address: 10.10.24.3

  document-converter:
    build:
      context: ./ragdiva-document-converter
      dockerfile: Dockerfile
    container_name: ragdiva-document-converter
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      ragdiva_network:
        ipv4_address: 10.10.24.4

  ragdiva-backend:
    build:
      context: ./ragdiva-backend
      dockerfile: Dockerfile
    container_name: ragdiva-backend
    restart: always
    depends_on:
      - rabbitmq
      - db
      - milvus
    networks:
      ragdiva_network:
        ipv4_address: 10.10.24.5
    volumes:
      - ./files:/app/files

  ragdiva-frontend:
    build:
      context: ./ragdiva-frontend
      dockerfile: Dockerfile
    container_name: ragdiva-frontend
    restart: always
    depends_on:
      - ragdiva-backend
    networks:
      ragdiva_network:
        ipv4_address: 10.10.24.6
  
  ragdiva-reverse-proxy:
    build:
      context: ./ragdiva-reverse-proxy
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8008:80"
    depends_on:
      - ragdiva-frontend
      - ragdiva-backend
    networks:
      ragdiva_network:
        ipv4_address: 10.10.24.7

  etcd:
    container_name: milvus-etcd-ragdiva
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      ragdiva_network:
        ipv4_address: 10.10.24.8

  minio:
    container_name: milvus-minio-ragdiva
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      ragdiva_network:
        ipv4_address: 10.10.24.9

  milvus:
    container_name: milvus-standalone-ragdiva
    image: milvusdb/milvus:v2.6.20
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - "etcd"
      - "minio"
    networks:
      ragdiva_network:
        ipv4_address: 10.10.24.10

volumes:
  rabbitmq_data:

networks:
  ragdiva_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.24.0/24
          gateway: 10.10.24.1